<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no, date=no, address=no">
  <title>MRVA — Grand Opening</title>
  <meta name="description" content="MRVA Grand Opening · Friday, 30th October 2026 · Al-Salam Mall, Salem Al Mubarak St, Salmiya, Kuwait">
  <link rel="preload" as="image" href="landing-bg.jpg">
  <link rel="preload" as="image" href="mrva-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="wobble">
      <div class="card" id="card" role="button" tabindex="0" aria-pressed="false" aria-label="Flip invitation">

        <!-- FRONT: landing -->
        <section class="face front">
          <img class="logo" src="mrva-logo.png" alt="MRVA">
        </section>

        <!-- BACK: event details -->
        <section class="face back poster" aria-hidden="true">
          <h1 class="title">GRAND<br>OPENING</h1>

          <div class="block">
            <div class="meta">
              <span class="label">Date</span>
              <span class="detail">Friday, 30th October 2026</span>
            </div>
            <p class="big">30.<br>10.<br>26</p>
          </div>

          <div class="block">
            <div class="meta">
              <span class="label">Location</span>
              <a class="detail" id="mapLink" href="https://maps.google.com/?q=Al-Salam+Mall,+Salem+Al+Mubarak+St,+Salmiya,+Kuwait" target="_blank" rel="noopener">Salem Al Mubarak St, Salmiya, Kuwait</a>
            </div>
            <p class="big">AL-SALAM<br>MALL</p>
          </div>
        </section>

      </div>
    </div>

    <!-- hints sit outside the card so they fade instead of flipping -->
    <div class="hints" aria-hidden="true">
      <p class="hint hint-front">details</p>
      <p class="hint hint-back">back</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
